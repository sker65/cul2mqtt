name: CUL2MQTT
version: '1.2.1'
slug: cul2mqtt
description: Bridge culfw CUL, COC, SCC, and CUNO radios to MQTT and Home Assistant discovery
url: https://github.com/sker65/cul2mqtt
arch:
  - aarch64
  - amd64
init: false
uart: true
udev: true
services:
  - mqtt:want
map:
  - addon_config:rw
options:
  serialport: /dev/ttyACM0
  host: ''
  port: 2323
  baudrate: 0
  cul_mode: SlowRF
  coc: false
  scc: false
  fht_central: ''
  fht_init: false
  fs20_devices: []
  uniroll_devices: []
  em_basis: []
  only: ''
  ignore: ''
  confirm_count: 3
  confirm_window: 3600
  instance_name: cul
  mqtt_url: ''
  mqtt_username: ''
  mqtt_password: ''
  mqtt_client_id_prefix: ''
  mqtt_tls_ca: ''
  log_level: info
  publish_raw: false
  publish_events: true
  offline_detection: true
  learn_intervals: true
  json_payloads: true
  ha_discovery: true
  ha_prefix: homeassistant
  maintenance: true
  stats_interval: 60
  raw_set: false
  map_file: ''
schema:
  serialport: str
  host: str
  port: port
  baudrate: int
  cul_mode: list(SlowRF|MORITZ|AskSin)
  coc: bool
  scc: bool
  fht_central: str
  fht_init: bool
  fs20_devices:
    - name: str
      address: match(^[0-9A-Fa-f]{6}$)
      type: list(switch|light|cover)?
      on_time: int?
      open: str?
      close: str?
      device_class: str?
      run_time: float(0,)?
      seconds_open: float(0,)?
      seconds_close: float(0,)?
      switch_time: float(0,)?
      calibrate: list(open|close)?
  uniroll_devices:
    - name: str
      address: match(^[0-9A-Fa-f]{4}/?[0-9A-Fa-f]$)
      stop_before_cmd: bool?
      seconds_open: float(0,)?
      seconds_close: float(0,)?
      switch_time: float(0,)?
      calibrate: list(open|close)?
  em_basis:
    - address: match(^[0-9A-Fa-f]{4}$)
      pulses: int(0,)
  only: str?
  ignore: str?
  confirm_count: int(1,)
  confirm_window: int(1,)
  instance_name: str
  mqtt_url: str?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_client_id_prefix: str?
  mqtt_tls_ca: str?
  log_level: list(error|warn|info|debug)
  publish_raw: bool
  publish_events: bool
  offline_detection: bool
  learn_intervals: bool
  json_payloads: bool
  ha_discovery: bool
  ha_prefix: str
  maintenance: bool
  stats_interval: int
  raw_set: bool
  map_file: str
